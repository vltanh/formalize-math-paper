schema_version: "1.1"
name: papers-join-one-repository
expected_outcome: |
  A plan in which the Lean code has one library per paper, each with a self-contained definitions module, beside shared Common/Basic and Common/External code; each paper's Challenge, Solution, comparator.json and formalization.yaml are kept together (palomar/<Paper>/), and its README, REPORT, CREDITS and route files together (docs/<Paper>/); an umbrella README at the root states the problem and connects the papers, each paper is a separate Palomar submission using comparator_config_path and formalization_metadata_path with one root LICENSE, and the first paper is moved into this layout (with its checks rerun) before the new papers' statements are written.
